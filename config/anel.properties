# ===== Proposta 2 - Eleicao em Anel (Chang-Roberts) =====
# Ordem do anel: cada processo envia ao proximo da lista (circular).
# Os IDs ficam fora de ordem de proposito, para a eleicao ficar visivel nos logs.
ring=3,7,1,8,5,2,6,4

node.1=127.0.0.1:6001
node.2=127.0.0.1:6002
node.3=127.0.0.1:6003
node.4=127.0.0.1:6004
node.5=127.0.0.1:6005
node.6=127.0.0.1:6006
node.7=127.0.0.1:6007
node.8=127.0.0.1:6008

# Tempo maximo (ms) para detectar que um vizinho nao responde (timeout TCP)
timeout.ms=1500
# Intervalo (ms) entre verificacoes (PING) do coordenador
heartbeat.ms=2000
# Se uma eleicao ficar sem resultado por este tempo (ms), ela e reiniciada
election.timeout.ms=10000
